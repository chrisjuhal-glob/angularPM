<form [formGroup]="form" (ngSubmit)="submit()">

  <div class="p-fluid">
    <div class="field">
      <label>Nombre</label>
      <input pInputText formControlName="name">
    </div>

    <div class="field">
      <label>Edad</label>
      <input pInputText type="number" formControlName="age">
    </div>

    <div class="field">
      <label>Email</label>
      <input pInputText formControlName="email">
    </div>

    <div class="field">
      <label>Condición</label>
      <input pInputText formControlName="condition">
    </div>

    <button pButton type="submit" label="Guardar"></button>
  </div>

</form>
